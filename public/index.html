<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Liar's Dice</title>
    <!-- Period display/body faces for the Tavern theme. They enhance that theme
         only and degrade gracefully to system serifs if a client is offline
         (the server never needs them). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Jost:wght@400;500;600&family=Monoton&family=Oswald:wght@400;500;600&family=Pirata+One&family=Poiret+One&family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
  </head>
  <body class="theme-tavern">
    <div class="embers" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <select id="themeSelect" class="theme-select" title="Theme" aria-label="Theme">
      <option value="theme-tavern">🍺 Tavern</option>
      <option value="theme-midnight">🌙 Midnight</option>
      <option value="theme-neon">🌆 Neon</option>
      <option value="theme-deco">🥂 Gilded Deco</option>
      <option value="theme-noir">🚬 Smoking Gun</option>
      <option value="theme-pixel">👾 Press Start</option>
    </select>
    <button id="speechBtn" class="mute speech" title="Toggle voice" aria-label="Toggle voice">🗣️</button>
    <button id="muteBtn" class="mute" title="Toggle sound" aria-label="Toggle sound">🔊</button>
    <canvas id="confetti"></canvas>
    <div id="netStatus" class="net-status hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <!-- Home: create or join -->
    <main id="home" class="screen">
      <h1>🎲 Liar's Dice</h1>
      <p class="tagline">No wilds · spot-on calls · 2–11 players</p>
      <div class="card">
        <label>Your name
          <input id="name" maxlength="20" placeholder="e.g. Sam" autocomplete="off" />
        </label>
        <button id="createBtn" class="primary">Create a game</button>
        <div class="divider"><span>or join one</span></div>
        <label>Room code
          <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase" />
        </label>
        <button id="joinBtn">Join game</button>
      </div>
    </main>

    <!-- Lobby -->
    <main id="lobby" class="screen hidden">
      <h2>Lobby</h2>
      <div class="code-banner">
        Room code: <strong id="lobbyCode"></strong>
        <button id="copyCode" class="ghost small">Copy invite link</button>
      </div>
      <ul id="memberList" class="member-list"></ul>

      <div id="botControls" class="bot-controls hidden">
        <button id="addBotBtn" class="small">🤖 Add bot</button>
        <button id="removeBotBtn" class="ghost small">Remove bot</button>
      </div>

      <div class="settings card">
        <h3>Game settings</h3>
        <div class="setting-row">
          <span>Ruleset</span>
          <select id="rulesetSelect" class="lobby-select"></select>
        </div>
        <p id="rulesetDesc" class="hint ruleset-desc"></p>
        <div class="setting-row">
          <span>Starting dice per player</span>
          <div class="stepper small-stepper">
            <button id="diceDown" data-setting="dice" data-dir="-1">−</button>
            <span id="diceVal" class="stepper-value"><span>5</span></span>
            <button id="diceUp" data-setting="dice" data-dir="1">+</button>
          </div>
        </div>
        <label class="setting-row toggle">
          <span>Show bid probabilities</span>
          <input id="probToggle" type="checkbox" />
        </label>
        <p id="settingsHint" class="hint"></p>
      </div>

      <button id="startBtn" class="primary hidden">Start game</button>
      <p id="lobbyHint" class="hint"></p>
      <button id="leaveLobby" class="ghost small">Leave</button>
    </main>

    <!-- Game -->
    <main id="game" class="screen hidden">
      <header class="game-header">
        <span id="roundLabel" class="pill"></span>
      </header>

      <section id="players" class="players"></section>

      <section id="reveal" class="reveal hidden"></section>

      <!-- The bid to beat, presented as a centerpiece just above your hand. -->
      <section id="currentBid" class="current-bid hidden"></section>

      <p id="myDiceCap" class="hand-cap hidden">Your dice</p>
      <section id="myDice" class="my-dice"></section>

      <section id="controls" class="controls hidden">
        <div class="bid-builder">
          <div class="stepper">
            <button data-step="qty" data-dir="-1">−</button>
            <span class="stepper-value"><span id="qtyVal">1</span><small>dice</small></span>
            <button data-step="qty" data-dir="1">+</button>
          </div>
          <div class="face-picker" id="facePicker"></div>
        </div>
        <button id="bidBtn" class="primary">Bid</button>
        <div class="call-row">
          <button id="challengeBtn" class="danger">Liar! (challenge)</button>
          <button id="spotBtn" class="warn">Spot on!</button>
        </div>
      </section>

      <section id="revealActions" class="reveal-actions hidden">
        <button id="nextRoundBtn" class="primary">Next round</button>
      </section>

      <section id="gameOver" class="game-over hidden">
        <h2 id="winnerText"></h2>
        <button id="rematchBtn" class="primary hidden">Play again</button>
      </section>

      <button id="leaveGame" class="ghost small">Leave game</button>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="client.js"></script>
  </body>
</html>
